schema_version: 1

policy:
  human_approval_required_for:
    - PROMOTE
    - KILL
    - PIVOT
    - READY_FOR_BUILD
    - RELEASE
  confidence_is_probability: false

gates:
  - id: G0_IDEA
    stage: DISCOVERY
    purpose: Decide whether an idea deserves structured investigation.
    human_approval: false
    required_artifacts:
      - product/01-discovery/problem.md
    checks:
      - A target user hypothesis exists.
      - A problem hypothesis exists.
      - The idea is framed without assuming the proposed solution is necessary.

  - id: G1_PROBLEM
    stage: DISCOVERY
    purpose: Decide whether the problem deserves continued validation.
    human_approval: false
    required_artifacts:
      - product/01-discovery/problem.md
      - product/01-discovery/evidence.md
      - product/01-discovery/assumptions.md
    checks:
      - Evidence and assumptions are explicitly separated.
      - Existing alternatives or workarounds have been examined.
      - Important evidence gaps are listed.

  - id: G2_PROMOTE
    stage: STRATEGY
    purpose: Decide whether an incubated idea should become an independent product repository.
    human_approval: true
    approval_action: PROMOTE
    required_artifacts:
      - product/02-market/market.md
      - product/02-market/competitors.md
      - product/04-strategy/value-proposition.md
    checks:
      - The opportunity is supported by evidence, not only enthusiasm.
      - Meaningful alternatives and differentiation have been considered.
      - Major feasibility risks are known.

  - id: G3_DEFINITION
    stage: DEFINITION
    purpose: Confirm that the product can be described clearly enough to design.
    human_approval: false
    required_artifacts:
      - product/03-users/jtbd.md
      - product/04-strategy/value-proposition.md
      - product/05-product/prd.md
    checks:
      - Target outcomes and non-goals are explicit.
      - Requirements trace back to a user/problem hypothesis.
      - Success metrics and open assumptions are recorded.

  - id: G4_BUILD
    stage: READY_FOR_BUILD
    purpose: Decide whether implementation should begin.
    human_approval: true
    approval_action: READY_FOR_BUILD
    required_artifacts:
      - product/05-product/prd.md
      - product/05-product/mvp-scope.md
      - product/06-ux/user-flow.md
      - product/07-engineering/architecture.md
      - product/07-engineering/security.md
    checks:
      - MVP scope tests a defined hypothesis.
      - Major UX flow is understood.
      - Architecture is proportional to the MVP.
      - Material security and operational risks are identified.
      - build.allowed is changed only after human approval.

  - id: G5_RELEASE
    stage: MVP_VALIDATION
    purpose: Decide whether the MVP is safe and measurable enough for validation.
    human_approval: true
    approval_action: RELEASE
    required_artifacts:
      - product/08-experiments/hypotheses.md
      - product/08-experiments/metrics.md
    checks:
      - Critical flows have been verified.
      - Known release risks are documented.
      - The validation hypothesis and metrics are defined.
      - release.allowed is changed only after human approval.
